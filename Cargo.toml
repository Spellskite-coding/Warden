[workspace]
resolver = "2"
members = [
    "warden-common",
    "warden-ransomware",
    "warden-persistence",
    "warden-privesc",
    "warden-yara",
    "warden-core",
    "warden-notify-helper",
    "warden-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.31", features = ["fanotify", "inotify", "signal", "process", "fs", "user"] }
libc = "0.2"
sd-notify = "0.5"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = true
strip = true
